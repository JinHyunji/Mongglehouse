<style>
:root{
  --bg:#fff6ec; --ink:#4a3b33; --muted:#9b877b; --card:#ffffff; --line:#f0dfcf;
  --accent:#ff8e72; --accent-ink:#fff; --wall:#ffe9d6; --floor:#e9c9a6;
  --hunger:#ff9f5a; --fun:#ff7aa2; --clean:#5cc3e8; --energy:#a68bff;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{max-width:520px;margin:0 auto;min-height:100%;position:relative;padding:16px}

.screen{display:none;flex-direction:column;gap:14px;min-height:calc(100dvh - 32px)}
.screen.active{display:flex;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 시작 */
#screen-start{justify-content:center}
.logo{font-size:clamp(28px,8vw,40px);margin:8px 0 0;letter-spacing:-1px;color:var(--accent);text-align:center}
.sub{margin:0 0 4px;color:var(--muted);text-align:center}
.adopt{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:8px}
.field[hidden]{display:none}
.label{font-weight:700;font-size:15px}
.species{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.species-card,.breed-card,.gender-btn{background:var(--card);border:2px solid var(--line);border-radius:20px;transition:transform .15s,border-color .15s,box-shadow .15s}
.species-card{padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.species-card img{height:120px;max-width:100%;object-fit:contain}
.species-card span{font-size:18px;font-weight:700}
.species-card:hover,.breed-card:hover,.gender-btn:hover{transform:translateY(-2px)}
.selected{border-color:var(--accent)!important;box-shadow:0 0 0 3px #ffd7cc;background:#fff8f5!important}
.breed-list{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.breed-card{padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600}
.breed-card img{height:64px;max-width:100%;object-fit:contain}
#pet-name,.name-row input{font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);min-width:0}
#pet-name:focus,.name-row input:focus{outline:none;border-color:var(--accent)}
.gender{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gender-btn{padding:12px;font-weight:700;font-size:16px}
.gender-btn[data-gender=m].selected{border-color:#5ca8e8!important;box-shadow:0 0 0 3px #d4e9fb;background:#f3f9ff!important}
.gender-btn[data-gender=f].selected{border-color:#ff7aa2!important;box-shadow:0 0 0 3px #ffd6e3;background:#fff4f8!important}
.primary{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 18px;font-weight:700}
.primary.big{padding:16px;font-size:17px}
.primary:disabled{opacity:.4;cursor:not-allowed}
.hint{margin:-6px 0 0;text-align:center;color:var(--muted);font-size:13px}
.name-row{display:flex;gap:8px}
.name-row input{flex:1}

/* HUD */
.hud{display:flex;justify-content:space-between;align-items:center}
.hud-name strong{font-size:22px;margin-right:6px}
.hud-name .g{font-weight:800;margin-right:6px}
.hud-name .g.m{color:#5ca8e8}.hud-name .g.f{color:#ff7aa2}
.hud-name span{color:var(--muted);font-size:14px}
.hud-right{display:flex;align-items:center;gap:8px}
.coin{background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px}
.icon-btn{width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:16px}
.xp{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:-6px}
#xp-bar{height:100%;width:0;background:linear-gradient(90deg,#ffc36b,var(--accent));transition:width .4s}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.stat span{font-size:13px;font-weight:600}
.bar{height:10px;background:#f3e4d6;border-radius:10px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:50%;border-radius:10px;transition:width .5s}
.stat[data-k=hunger] i{background:var(--hunger)}
.stat[data-k=fun] i{background:var(--fun)}
.stat[data-k=clean] i{background:var(--clean)}
.stat[data-k=energy] i{background:var(--energy)}
.stat.low span{color:#e0504a}
.stat.low .bar{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.5}}

/* 방 */
.room{position:relative;flex:1;min-height:340px;border-radius:26px;overflow:hidden;border:2px solid var(--line);touch-action:manipulation}
.wall{position:absolute;inset:0 0 38% 0;background:#ffe9d6}
.floor{position:absolute;inset:62% 0 0 0;background:#e9c9a6}
/* 벽지 */
.wall-mint .wall{background:repeating-linear-gradient(90deg,#dff5ea 0 22px,#cdeedd 22px 44px)}
.wall-pink .wall{background:#ffe4ec radial-gradient(#ffc2d4 3px,transparent 3.5px) 0 0/26px 26px}
.wall-sky .wall{background:#e3f1ff;background-image:linear-gradient(#cfe4fb 2px,transparent 2px),linear-gradient(90deg,#cfe4fb 2px,transparent 2px);background-size:30px 30px}
.wall-night .wall{background:#2e3466 radial-gradient(#fff6 1.5px,transparent 2px) 0 0/34px 34px}
.wall-lemon .wall{background:repeating-linear-gradient(45deg,#fff6c9 0 14px,#fff0a8 14px 28px)}
/* 바닥 */
.floor-wood .floor{background:repeating-linear-gradient(90deg,#e9c9a6 0 46px,#dfbb94 46px 48px)}
.floor-check .floor{background:#fff;background-image:conic-gradient(#f2d7c5 25%,#fff 0 50%,#f2d7c5 0 75%,#fff 0);background-size:36px 36px}
.floor-grass .floor{background:repeating-linear-gradient(90deg,#a9d98a 0 6px,#9fd27f 6px 12px)}
.floor-marble .floor{background:linear-gradient(135deg,#f4f1f6,#dcd6e4 60%,#f4f1f6)}
.floor-pinkcarpet .floor{background:#f8c7d4 radial-gradient(#f3b2c4 2px,transparent 2.5px) 0 0/12px 12px}
.room::before{content:"";position:absolute;left:0;right:0;top:62%;height:8px;background:rgba(120,70,30,.18);z-index:0}
.window{position:absolute;top:8%;left:8%;width:30%;aspect-ratio:1.1;border:7px solid #fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 0 #e8cdb5}
.sky{width:100%;height:100%;background:linear-gradient(#9bd8ff,#d9f1ff);transition:background 1s}
.room.night .sky{background:linear-gradient(#1d2450,#3b3f7a)}
.rug{position:absolute;left:50%;bottom:7%;width:70%;height:16%;transform:translateX(-50%);border-radius:50%;background:#f7b9a6;opacity:.7}
.pet-wrap{position:absolute;left:50%;bottom:12%;width:min(56%,250px);z-index:2;transform:translateX(-50%);transition:left .9s ease}
.pet{width:100%;display:block;position:relative;z-index:2;cursor:pointer;transform-origin:50% 100%;animation:idle 2.6s ease-in-out infinite;-webkit-user-drag:none}
.pet.flip{scale:-1 1}
.shadow{position:absolute;left:15%;right:15%;bottom:-4px;height:16px;border-radius:50%;background:rgba(90,50,20,.18);z-index:1}
@keyframes idle{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.975) scaleX(1.01)}}
.pet.hop{animation:hop .5s ease 2}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16%) rotate(-3deg)}}
.pet.wiggle{animation:wiggle .18s linear 6}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.pet.munch{animation:munch .25s ease 6}
@keyframes munch{50%{transform:scaleY(.94) translateY(3%)}}
.pet.sad{filter:saturate(.6) brightness(.95)}
.pet.sleeping{animation:breathe 3s ease-in-out infinite;filter:brightness(.8)}
@keyframes breathe{50%{transform:scaleY(.96)}}
.pet.dirty{filter:sepia(.35) saturate(.8)}

.bubble{position:absolute;bottom:100%;left:50%;transform:translate(-50%,-4px) scale(.8);background:#fff;border:2px solid var(--line);border-radius:16px;padding:7px 12px;font-size:14px;white-space:nowrap;opacity:0;transition:.2s;z-index:3;pointer-events:none}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:#fff}
.bubble.show{opacity:1;transform:translate(-50%,-4px) scale(1)}

#fx{position:absolute;inset:0;pointer-events:none;z-index:4}
.float{position:absolute;font-size:26px;animation:float 1.2s ease-out forwards}
@keyframes float{from{opacity:1;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-90px) scale(1.2)}}
.ball{position:absolute;font-size:30px;bottom:14%;animation:ball 1.1s ease-in-out}
@keyframes ball{0%{left:10%;transform:translateY(0)}50%{transform:translateY(-140px) rotate(360deg)}100%{left:80%;transform:translateY(0) rotate(720deg)}}

#poops{position:absolute;inset:0;z-index:3;pointer-events:none}
.poop{position:absolute;font-size:28px;pointer-events:auto;cursor:pointer;animation:pop .3s ease}
@keyframes pop{from{transform:scale(0)}}

#sleep-overlay{position:absolute;inset:0;background:rgba(20,20,60,.35);opacity:0;transition:opacity 1s;pointer-events:none;z-index:2}
.room.night #sleep-overlay{opacity:1}
.zzz{position:absolute;font-weight:800;color:#fff;font-size:22px;animation:float 2.4s ease-out forwards}

/* 행동 */
.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.actions button{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600;transition:transform .1s}
.actions button b{font-size:24px;line-height:1.1}
.actions button small{font-size:10px;color:var(--muted)}
.actions button:active{transform:scale(.94)}
.actions button:disabled{opacity:.4;cursor:not-allowed}
.actions button.on{background:#ece6ff;border-color:var(--energy)}

dialog{border:0;border-radius:22px;padding:22px;width:min(92vw,360px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(60,40,30,.4)}
dialog h3{margin:0 0 6px}
dialog p{color:var(--muted);font-size:14px;margin:0 0 14px;line-height:1.5}
dialog > button{display:block;width:100%;margin-top:8px;padding:12px;border-radius:14px;background:#f6ece2;font-weight:600}
dialog .danger{background:#ffe3e0;color:#c4413a}
dialog .danger.confirm{background:#e0504a;color:#fff}
dialog .name-row button{background:#f6ece2;border-radius:14px;padding:0 14px;font-weight:600}

#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:10;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:400px){
  .actions button{font-size:11px}
  .actions button b{font-size:20px}
  .stats{gap:6px 10px}
}

/* 상단 도구 */
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tools button{background:#fff;border:2px solid var(--line);border-radius:999px;padding:8px 4px;font-weight:700;font-size:14px}
.tools button:active{transform:scale(.96)}

/* 가구 */
#furniture{position:absolute;inset:0;z-index:1}
.furn{position:absolute;transform:translate(-50%,-100%);line-height:1;filter:drop-shadow(0 3px 0 rgba(90,50,20,.15));touch-action:none;user-select:none}
.room.deco .furn{cursor:grab;outline:2px dashed #ff8e72aa;outline-offset:3px;border-radius:8px}
.room.deco .furn.dragging{cursor:grabbing;outline-style:solid;z-index:50!important}
#deco-banner{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#fffc;border-radius:999px;padding:6px 12px;font-size:12px;white-space:nowrap;display:none;z-index:6}
.room.deco #deco-banner{display:block}
.room.deco .pet-wrap{opacity:.35;pointer-events:none}
.deco-panel{background:#fff;border:2px solid var(--line);border-radius:20px;padding:10px}
.deco-panel[hidden]{display:none}
.deco-tabs{display:flex;gap:6px;margin-bottom:8px}
.deco-tabs button{padding:6px 12px;border-radius:999px;background:#f6ece2;font-weight:600;font-size:13px}
.deco-tabs button.on{background:var(--ink);color:#fff}
.deco-tabs .primary{margin-left:auto;padding:6px 16px}
.deco-list{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.deco-item{flex:0 0 auto;min-width:64px;border:2px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;font-size:11px;gap:2px;background:#fff}
.deco-item b{font-size:26px;line-height:1.1}
.deco-item.on{border-color:var(--accent);background:#fff5f1}
.deco-empty{color:var(--muted);font-size:13px;padding:10px}
.swatch{width:40px;height:28px;border-radius:8px;border:1px solid #0001;position:relative;overflow:hidden}
.swatch .wall,.swatch .floor{inset:0}

/* 시트 다이얼로그 */
dialog.sheet{width:min(96vw,500px);max-height:86vh;padding:16px;overflow:auto}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sheet-head h3{margin:0;flex:1}
.x{width:32px;height:32px;border-radius:50%;background:#f6ece2}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{flex:0 0 auto;padding:7px 14px;border-radius:999px;background:#f6ece2;font-weight:600;font-size:14px}
.tabs button.on{background:var(--ink);color:#fff}
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{border:2px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:#fff}
.item .ico{font-size:34px;line-height:1.2}
.item .swatch{width:64px;height:40px;margin:2px 0 4px}
.item b{font-size:14px}
.item small{color:var(--muted);font-size:11px;line-height:1.35;min-height:2.7em}
.item button{margin-top:4px;width:100%;padding:8px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:13px}
.item button:disabled{background:#e8ddd3;color:#a89585;cursor:not-allowed}
.item.on{border-color:var(--accent);background:#fff8f5}
.item .cnt{font-size:12px;font-weight:700;color:var(--accent)}
dialog.sheet h4{margin:14px 0 8px}
dialog.sheet h4 small{color:var(--muted);font-weight:400;font-size:12px}
.empty{color:var(--muted);font-size:13px;grid-column:1/-1}

/* 공받기 */
#minigame{position:fixed;inset:0;z-index:20;background:linear-gradient(#bfe6ff,#e8f7ff 60%,#bfe7a8 60%);display:flex;flex-direction:column}
#minigame[hidden]{display:none}
.mg-head{display:flex;justify-content:space-between;padding:12px 16px;font-size:18px;font-weight:700;max-width:520px;width:100%;margin:0 auto}
#mg-canvas{flex:1;width:100%;max-width:520px;margin:0 auto;display:block;touch-action:none}
.mg-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#fff8;text-align:center;padding:24px}
.mg-overlay[hidden]{display:none}
.mg-overlay h2{margin:0;font-size:30px;color:var(--accent)}
.mg-overlay p{margin:0;line-height:1.6}
.mg-overlay .legend{background:#fff;border-radius:999px;padding:6px 14px;font-size:14px}
.mg-overlay .primary{min-width:200px}
.link{color:var(--muted);text-decoration:underline;padding:6px}

/* 성장 단계별 크기 */
.pet-wrap[data-stage=baby]{width:min(40%,180px)}
.pet-wrap[data-stage=teen]{width:min(50%,225px)}
.pet-wrap[data-stage=adult]{width:min(64%,290px)}
.pet-wrap{transition:left .9s ease,width .8s ease}
.actions[hidden]{display:none}
#btn-deco-done{background:var(--accent);color:#fff}
.hud-name span#hud-meta{display:block;margin-top:2px;font-size:13px}
.hud-name{min-width:0}
</style>
</head>

      </div>
      <div class="field" id="breed-field" hidden>
        <span class="label">품종</span>
        <div id="breed-list" class="breed-list"></div>
      </div>
      <div class="field">
        <label class="label" for="pet-name">이름</label>
        <input id="pet-name" maxlength="10" autocomplete="off" placeholder="예: 몽이">
      </div>
      <div class="field">
        <span class="label">성별</span>
        <div class="gender">
          <button type="button" class="gender-btn" data-gender="m">♂ 남아</button>
          <button type="button" class="gender-btn" data-gender="f">♀ 여아</button>
        </div>
      </div>
      <button type="submit" class="primary big" id="btn-adopt" disabled>입양하고 시작하기</button>
      <p class="hint" id="adopt-hint">동물, 이름, 성별을 골라 주세요</p>
    </form>
  </section>

  <!-- 3. 게임 -->
  <section id="screen-game" class="screen">
    <header class="hud">
      <div class="hud-name">
        <strong id="hud-name">몽이</strong><b id="hud-gender" class="g"></b>
        <span id="hud-meta">Lv.1 · 1일째</span>
      </div>
      <div class="hud-right">
        <span class="coin" title="코인">🪙 <b id="hud-coins">0</b></span>
        <button class="icon-btn" id="btn-menu" aria-label="메뉴">⚙</button>
      </div>
    </header>

    <div class="xp"><div id="xp-bar"></div></div>

    <div class="stats">
      <div class="stat" data-k="hunger"><span>🍖 배부름</span><div class="bar"><i></i></div></div>
      <div class="stat" data-k="fun"><span>🎾 행복</span><div class="bar"><i></i></div></div>
      <div class="stat" data-k="clean"><span>🫧 청결</span><div class="bar"><i></i></div></div>
      <div class="stat" data-k="energy"><span>💤 기운</span><div class="bar"><i></i></div></div>
    </div>

    <div class="tools">
      <button id="btn-shop">🛒 상점</button>
      <button id="btn-deco">🎨 꾸미기</button>
      <button id="btn-game">🎾 공받기</button>
    </div>

    <div id="room" class="room wall-cream floor-wood">
      <div class="wall"></div><div class="floor"></div>
      <div class="window"><div class="sky"></div></div>
      <div class="rug"></div>
      <div id="furniture"></div>
      <div id="poops"></div>
      <div id="pet-wrap" class="pet-wrap">
        <div id="bubble" class="bubble"></div>
        <img id="pet" class="pet" src="" alt="내 반려동물" draggable="false">
        <div class="shadow"></div>
      </div>
      <div id="fx"></div>
      <div id="sleep-overlay"></div>
      <div id="deco-banner">가구를 끌어서 옮기고, 누르면 치울 수 있어요</div>
    </div>

    <!-- 꾸미기 도구 -->
    <div id="deco-panel" class="deco-panel" hidden>
      <div class="deco-tabs">
        <button data-tab="furniture" class="on">가구</button>
        <button data-tab="wall">벽지</button>
        <button data-tab="floor">바닥</button>
        <button id="btn-deco-done" class="primary">완료</button>
      </div>
      <div id="deco-list" class="deco-list"></div>
    </div>

    <nav class="actions" id="actions">
      <button data-act="feed"><b>🍖</b>밥주기</button>
      <button data-act="play"><b>🎾</b>놀아주기</button>
      <button data-act="wash"><b>🛁</b>씻기기</button>
      <button data-act="sleep" id="btn-sleep"><b>🌙</b>재우기</button>
      <button data-act="bag"><b>🎒</b>가방</button>
    </nav>
  </section>

  <!-- 상점 -->
  <dialog id="shop" class="sheet">
    <div class="sheet-head"><h3>🛒 상점</h3><span class="coin">🪙 <b id="shop-coins">0</b></span><button class="x" data-close>✕</button></div>
    <div class="tabs" id="shop-tabs">
      <button data-tab="food" class="on">음식</button>
      <button data-tab="toy">장난감</button>
      <button data-tab="furniture">가구</button>
      <button data-tab="wall">벽지</button>
      <button data-tab="floor">바닥</button>
    </div>
    <div id="shop-list" class="item-grid"></div>
  </dialog>

  <!-- 가방 -->
  <dialog id="bag" class="sheet">
    <div class="sheet-head"><h3>🎒 가방</h3><button class="x" data-close>✕</button></div>
    <h4>음식</h4>
    <div id="bag-food" class="item-grid"></div>
    <h4>장난감 <small>놀아주기에 쓸 장난감을 골라요</small></h4>
    <div id="bag-toy" class="item-grid"></div>
  </dialog>

  <!-- 공받기 -->
  <section id="minigame" hidden>
    <div class="mg-head">
      <span>🎾 <b id="mg-score">0</b></span>
      <span id="mg-lives">❤️❤️❤️</span>
      <span>⏱ <b id="mg-time">40</b></span>
    </div>
    <canvas id="mg-canvas"></canvas>
    <div id="mg-overlay" class="mg-overlay">
      <h2>공받기</h2>
      <p>좌우로 끌거나 ← → 키로 움직여서<br>떨어지는 공을 받아요!</p>
      <p class="legend">🎾 +1 &nbsp; ⭐ +3 &nbsp; 🦴 +2 &nbsp; 💧 피하기</p>
      <button id="mg-start" class="primary big">시작!</button>
      <button id="mg-quit" class="link">그만하기</button>
    </div>
  </section>

  <!-- 메뉴 -->
  <dialog id="menu">
    <h3>메뉴</h3>
    <p id="menu-info"></p>
    <div class="name-row">
      <input id="rename-input" maxlength="10" autocomplete="off" aria-label="새 이름">
      <button id="btn-rename">이름 바꾸기</button>
    </div>
    <button id="btn-reset" class="danger">처음부터 다시 하기</button>
    <button id="btn-close" class="primary">닫기</button>
  </dialog>

  s.floor ??= "wood";
  s.best ??= 0;
  return s;
}

// ---------- 저장 ----------
function load() {
  try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch { return null; }
}
function save() {
  if (!state) return;
  state.last = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch {}
}
function wipe() { try { localStorage.removeItem(SAVE_KEY); } catch {} }

// ---------- DOM ----------
const $ = (s) => document.querySelector(s);
const screens = { start: $("#screen-start"), game: $("#screen-game") };
const petEl = $("#pet"), petWrap = $("#pet-wrap"), bubble = $("#bubble"), room = $("#room"), fx = $("#fx");
function show(name) {
  Object.values(screens).forEach((el) => el.classList.remove("active"));
  screens[name].classList.add("active");
}
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const clamp = (v) => Math.max(0, Math.min(100, v));

// ---------- 입양 ----------
let chosenSpecies = null, chosenBreed = null, chosenGender = null;
const GENDER_KO = { m: "남아", f: "여아" };

document.querySelectorAll(".species-card").forEach((btn) =>

    document.querySelectorAll(".species-card").forEach((c) => c.classList.toggle("selected", c === btn));

document.querySelectorAll(".gender-btn").forEach((btn) =>

function updateAdopt() {

$("#adopt-form").addEventListener("submit", (e) => {

// ---------- 게임 ----------
let state = null, tickTimer = null, wanderTimer = null, saveTimer = null, busyUntil = 0;

function breedInfo() { return BREEDS[state.species].find((b) => b.id === state.breed); }
const lines = () => LINES[state.species];
const xpNeed = (lv) => 30 + lv * 20;

function say(text, ms = 2200) {
  bubble.textContent = text; bubble.classList.add("show");
  clearTimeout(say.t); say.t = setTimeout(() => bubble.classList.remove("show"), ms);
}
function anim(cls, ms) {
  petEl.classList.remove("hop", "wiggle", "munch"); void petEl.offsetWidth;
  petEl.classList.add(cls); setTimeout(() => petEl.classList.remove(cls), ms);
}
function floatFx(emoji, n = 3) {
  const r = petWrap.getBoundingClientRect(), rr = room.getBoundingClientRect();
  for (let i = 0; i < n; i++) {
    const el = document.createElement("span"); el.className = "float"; el.textContent = emoji;
    el.style.left = (r.left - rr.left + r.width * (0.2 + Math.random() * 0.6)) + "px";
    el.style.top = (r.top - rr.top + r.height * (0.1 + Math.random() * 0.3)) + "px";
    el.style.animationDelay = i * 0.15 + "s";
    fx.appendChild(el); setTimeout(() => el.remove(), 1600);
  }
}

function applyMinutes(min) {
  const d = { ...(state.sleeping ? DECAY.asleep : DECAY.awake) };
  if (state.sleeping && hasPlaced("basket")) d.energy = 6.5;
  const dirtPenalty = state.poops.length * 0.4;
  STATS.forEach((k) => (state.stats[k] = clamp(state.stats[k] + d[k] * min - (k === "clean" ? dirtPenalty * min : 0))));
  // 배고프거나 지저분하면 행복도도 떨어짐
  if (state.stats.hunger < 20 || state.stats.clean < 20) state.stats.fun = clamp(state.stats.fun - 0.5 * min);
  if (state.sleeping && state.stats.energy >= 100) {
    state.sleeping = false;
    if (min < 5) { say(state.species === "dog" ? "잘 잤다 멍!" : "잘 잤다냥~"); }
  }
}

function maybePoop(min) {
  if (state.sleeping) return;
  state.nextPoop -= min;
  if (state.nextPoop <= 0 && state.poops.length < 4) {
    state.poops.push({ x: 8 + Math.random() * 78, y: 4 + Math.random() * 18, id: Date.now() + Math.random() });
    state.nextPoop = 4 + Math.random() * 5;
    renderPoops();
  }
}

function gainXp(n) {
  state.xp += n;
  while (state.xp >= xpNeed(state.level)) {
    state.xp -= xpNeed(state.level); state.level++; state.coins += 10;
    toast(`🎉 ${state.name}이(가) 레벨 ${state.level}이 되었어요! 🪙 +10`);
    floatFx("⭐", 5);
  }
}

function render() {
  STATS.forEach((k) => {
    const el = document.querySelector(`.stat[data-k=${k}]`);
    el.querySelector("i").style.width = state.stats[k] + "%";
    el.classList.toggle("low", state.stats[k] < 20);
  });
  const days = Math.floor((Date.now() - state.born) / 86400000) + 1;
  $("#hud-name").textContent = state.name;
  const g = $("#hud-gender"); g.textContent = state.gender === "f" ? "♀" : state.gender === "m" ? "♂" : ""; g.className = "g " + (state.gender || "");
  const stg = stageOf();
  $("#hud-meta").textContent = `${breedInfo().name} · ${STAGE_KO_SP[state.species][stg]} · ${ageText(ageMonths())} · Lv.${state.level}`;
  if (state.stage !== stg) growUp(stg);
  $("#hud-coins").textContent = state.coins;
  $("#xp-bar").style.width = (state.xp / xpNeed(state.level)) * 100 + "%";

  room.classList.toggle("night", state.sleeping);
  petEl.classList.toggle("sleeping", state.sleeping);
  const avg = STATS.reduce((s, k) => s + state.stats[k], 0) / 4;
  petEl.classList.toggle("sad", !state.sleeping && avg < 30);
  petEl.classList.toggle("dirty", state.stats.clean < 25);

  const sleepBtn = $("#btn-sleep");
  sleepBtn.innerHTML = state.sleeping ? "<b>☀️</b>깨우기" : "<b>🌙</b>재우기";
  sleepBtn.classList.toggle("on", state.sleeping);
  document.querySelectorAll(".actions button").forEach((b) => {
    if (b.dataset.act !== "sleep") b.disabled = state.sleeping;
  });
  $("#btn-game").disabled = state.sleeping;
}

function growUp(stg) {
  const first = !state.stage;
  state.stage = stg;
  petEl.src = IMG(sprite());
  petWrap.dataset.stage = stg;
  if (first) return;
  const word = STAGE_KO_SP[state.species][stg];
  toast(`🎉 ${state.name}이(가) ${word}${stg === "adult" ? "이(가) 되었어요!" : " 시기에 접어들었어요!"} 🪙 +20`);
  state.coins += 20;
  anim("hop", 1000); floatFx("🌟", 6);
  say(stg === "adult" ? "이제 다 컸어요!" : "나 좀 컸죠?", 3000);
  save();
}

function renderPoops() {
  const box = $("#poops"); box.innerHTML = "";
  state.poops.forEach((p) => {
    const el = document.createElement("button");
    el.className = "poop"; el.textContent = "💩"; el.title = "치우기";
    el.style.left = p.x + "%"; el.style.bottom = p.y + "%";
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      state.poops = state.poops.filter((q) => q.id !== p.id);
      state.stats.clean = clamp(state.stats.clean + 5); state.coins += 1; gainXp(2);
      floatFx("✨", 2); renderPoops(); render(); save();
    });
    box.appendChild(el);
  });
}

function complain() {
  if (state.sleeping) return;
  const s = state.stats, L = lines();
  if (s.hunger < 25) say(pick(L.hungry));
  else if (s.energy < 20) say(pick(L.tired));
  else if (s.clean < 25) say(pick(L.dirty));
  else if (s.fun < 25) say(pick(L.bored));
}

function tick() {
  const now = Date.now();
  const min = (now - state.last) / 60000;
  state.last = now;
  applyMinutes(min); maybePoop(min); render();
  if (Math.random() < 0.04) complain();
  if (state.sleeping && Math.random() < 0.3) zzz();
}

function zzz() {
  const r = petWrap.getBoundingClientRect(), rr = room.getBoundingClientRect();
  const el = document.createElement("span"); el.className = "zzz"; el.textContent = "Z";
  el.style.left = (r.right - rr.left - r.width * 0.25) + "px";
  el.style.top = (r.top - rr.top + 10) + "px";
  el.style.fontSize = 16 + Math.random() * 14 + "px";
  fx.appendChild(el); setTimeout(() => el.remove(), 2500);
}

function wander() {
  if (!state || state.sleeping || Date.now() < busyUntil) return;
  const x = 25 + Math.random() * 50;
  const cur = parseFloat(petWrap.style.left || "50");
  petEl.classList.toggle("flip", x > cur);
  petWrap.style.left = x + "%";
}

const ACTIONS = {
  feed() {
    if (state.stats.hunger > 92) return say(pick(lines().full));
    state.stats.hunger = clamp(state.stats.hunger + 30 + (hasPlaced("bowl") ? 10 : 0));
    state.stats.clean = clamp(state.stats.clean - 3);
    state.nextPoop = Math.min(state.nextPoop, 1 + Math.random() * 2);
    anim("munch", 1500); floatFx(state.species === "dog" ? "🍖" : "🐟"); say(pick(lines().feed));
    state.coins += 1; gainXp(5);
  },
  play() {
    if (state.stats.energy < 15) return say(pick(lines().tooTired));
    const toy = findItem("toy", state.activeToy) || SHOP.toy[0];
    state.stats.fun = clamp(state.stats.fun + toy.fun);
    state.stats.energy = clamp(state.stats.energy - 12);
    state.stats.hunger = clamp(state.stats.hunger - 6);
    state.stats.clean = clamp(state.stats.clean - 5);
    const ball = document.createElement("span"); ball.className = "ball";
    ball.textContent = toy.ico;
    fx.appendChild(ball); setTimeout(() => ball.remove(), 1100);
    anim("hop", 1000); floatFx("💕"); say(pick(lines().play));
    state.coins += 2; gainXp(8);
  },
  wash() {
    state.stats.clean = 100;
    state.stats.fun = clamp(state.stats.fun - (state.species === "cat" ? 8 : 2));
    anim("wiggle", 1100); floatFx("🫧", 6); say(pick(lines().wash));
    state.coins += 1; gainXp(5);
  },
  sleep() {
    state.sleeping = !state.sleeping;
    if (state.sleeping) { say(state.species === "dog" ? "잘 자요 멍…" : "잘 자라냥…"); }
    else {
      say(state.stats.energy < 50 ? "으음… 아직 졸려요" : (state.species === "dog" ? "좋은 아침 멍!" : "일어났다냥~"));
      anim("hop", 1000);
    }
  },
  bag() { openBag(); },
};

document.querySelectorAll(".actions button").forEach((b) =>
  b.addEventListener("click", () => {
    if (!state) return;
    tick();
    if (b.dataset.act !== "bag") busyUntil = Date.now() + 1500;
    ACTIONS[b.dataset.act]();
    render(); save();
  }));

let lastPet = 0;
petEl.addEventListener("click", () => {
  if (!state) return;
  if (state.sleeping) return say("쿨쿨…");
  floatFx("💗", 2); anim("wiggle", 600); say(pick(lines().pet), 1500);
  if (Date.now() - lastPet > 3000) { state.stats.fun = clamp(state.stats.fun + 3); gainXp(1); render(); save(); }
  lastPet = Date.now();
});

function startGame(fresh) {
  migrate(state);
  state.stage = stageOf();   // 자리 비운 사이 자란 건 조용히 반영
  petEl.src = IMG(sprite());
  petWrap.dataset.stage = state.stage;
  applyRoom();
  petWrap.style.left = "50%";
  // 자리를 비운 동안의 변화 반영
  const away = Math.min((Date.now() - state.last) / 60000, MAX_OFFLINE_MIN);
  if (away > 0.05) {
    // 오래 비우면 여러 단계로 나눠 계산 (잠에서 깨는 시점 반영)
    let left = away;
    while (left > 0) { const step = Math.min(left, 5); applyMinutes(step); maybePoop(step); left -= step; }
  }
  state.last = Date.now();
  show("game"); renderPoops(); render();
  if (fresh) {
    say(`안녕! 나는 ${state.name}! ${pick(lines().hi)}`, 3000);
  } else if (away > 30) {
    toast(`${Math.round(away / 60 * 10) / 10}시간 만이에요! ${state.name}이(가) 기다렸어요`);
    setTimeout(complain, 800);
  } else {
    say(pick(lines().hi));
  }
  clearInterval(tickTimer); clearInterval(wanderTimer);
  tickTimer = setInterval(() => { tick(); }, 1000);
  wanderTimer = setInterval(wander, 4500);
  clearInterval(saveTimer); saveTimer = setInterval(save, 5000);
}

// ---------- 공통: 다이얼로그 ----------
document.querySelectorAll("dialog [data-close]").forEach((b) =>
  b.addEventListener("click", () => b.closest("dialog").close()));
document.querySelectorAll("dialog.sheet").forEach((d) =>
  d.addEventListener("click", (e) => { if (e.target === d) d.close(); }));

function spend(price) {
  if (state.coins < price) { toast(`🪙 코인이 ${price - state.coins}개 부족해요. 공받기로 모아 보세요!`); return false; }
  state.coins -= price; return true;
}
function swatch(kind, id) {
  return `<div class="swatch ${kind}-${id}"><div class="${kind}"></div></div>`;
}

// ---------- 상점 ----------
const shopDlg = $("#shop");
let shopTab = "food";
$("#btn-shop").addEventListener("click", () => { renderShop(); shopDlg.showModal(); });
$("#shop-tabs").addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return;
  shopTab = t.dataset.tab; renderShop();
});

function owned(cat, id) {
  if (cat === "toy") return state.toys.includes(id);
  if (cat === "furniture") return state.furn.includes(id);
  if (cat === "wall") return state.walls.includes(id);
  if (cat === "floor") return state.floors.includes(id);
  return false;
}

function renderShop() {
  $("#shop-coins").textContent = state.coins;
  document.querySelectorAll("#shop-tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === shopTab));
  const list = $("#shop-list"); list.innerHTML = "";
  SHOP[shopTab].forEach((it) => {
    const has = owned(shopTab, it.id);
    const el = document.createElement("div"); el.className = "item";
    const pic = shopTab === "wall" || shopTab === "floor" ? swatch(shopTab, it.id) : `<span class="ico">${it.ico}</span>`;
    const cnt = shopTab === "food" ? `<span class="cnt">가방에 ${state.food[it.id] || 0}개</span>` : "";
    el.innerHTML = `${pic}<b>${it.name}</b><small>${it.desc || (it.price ? "방 분위기 바꾸기" : "기본")}</small>${cnt}
      <button ${has || state.coins < it.price ? "disabled" : ""}>${has ? "보유 중" : `🪙 ${it.price}`}</button>`;
    el.querySelector("button").addEventListener("click", () => buy(shopTab, it));
    list.appendChild(el);
  });
}

function buy(cat, it) {
  if (owned(cat, it.id) || !spend(it.price)) return;
  if (cat === "food") state.food[it.id] = (state.food[it.id] || 0) + 1;
  if (cat === "toy") { state.toys.push(it.id); state.activeToy = it.id; }
  if (cat === "furniture") { state.furn.push(it.id); placeItem(it.id); }
  if (cat === "wall") { state.walls.push(it.id); state.wall = it.id; }
  if (cat === "floor") { state.floors.push(it.id); state.floor = it.id; }
  const msg = { food: "가방에 넣었어요", toy: "놀아주기에 바로 써요", furniture: "방에 놓았어요! 꾸미기에서 옮길 수 있어요", wall: "벽지를 바꿨어요", floor: "바닥을 바꿨어요" }[cat];
  toast(`${it.ico || "✨"} ${it.name} 구매! ${msg}`);
  applyRoom(); renderShop(); render(); save();
}

// ---------- 가방 ----------
const bagDlg = $("#bag");
function openBag() { renderBag(); bagDlg.showModal(); }
function renderBag() {
  const fl = $("#bag-food"); fl.innerHTML = "";
  const foods = SHOP.food.filter((f) => state.food[f.id] > 0);
  if (!foods.length) fl.innerHTML = `<p class="empty">음식이 없어요. 상점에서 사 올 수 있어요.</p>`;
  foods.forEach((f) => {
    const el = document.createElement("div"); el.className = "item";
    el.innerHTML = `<span class="ico">${f.ico}</span><b>${f.name}</b><small>${f.desc}</small><span class="cnt">${state.food[f.id]}개</span><button ${state.sleeping ? "disabled" : ""}>먹이기</button>`;
    el.querySelector("button").addEventListener("click", () => useFood(f));
    fl.appendChild(el);
  });
  const tl = $("#bag-toy"); tl.innerHTML = "";
  state.toys.map((id) => findItem("toy", id)).filter(Boolean).forEach((t) => {
    const on = t.id === state.activeToy;
    const el = document.createElement("div"); el.className = "item" + (on ? " on" : "");
    el.innerHTML = `<span class="ico">${t.ico}</span><b>${t.name}</b><small>${t.desc}</small><button ${on ? "disabled" : ""}>${on ? "사용 중" : "이걸로 놀기"}</button>`;
    el.querySelector("button").addEventListener("click", () => { state.activeToy = t.id; renderBag(); save(); });
    tl.appendChild(el);
  });
}
function useFood(f) {
  if (state.sleeping || !(state.food[f.id] > 0)) return;
  state.food[f.id]--;
  Object.entries(f.eff).forEach(([k, v]) => (state.stats[k] = clamp(state.stats[k] + v)));
  if (f.eff.hunger) state.nextPoop = Math.min(state.nextPoop, 1 + Math.random() * 2);
  gainXp(f.xp || 6);
  bagDlg.close();
  anim(f.eff.hunger >= 30 ? "munch" : "hop", 1300); floatFx(f.ico, 4);
  say(pick(f.id === "cookie" || f.id === "cupcake" || f.id === "cake" ? lines().treat : lines().feed));
  render(); save();
}

// ---------- 방 꾸미기 ----------
const furnBox = $("#furniture");
let decoMode = false, decoTab = "furniture";
const hasPlaced = (id) => !!state && state.placed.some((p) => p.id === id);

function placeItem(id) {
  if (hasPlaced(id)) return;
  const it = findItem("furniture", id);
  const n = state.placed.length;
  state.placed.push({ id, x: 12 + ((n * 23) % 76), y: it.wall ? 38 : 90 });
}

function applyRoom() {
  room.className = room.className.replace(/\b(wall|floor)-\S+/g, "").trim();
  room.classList.add("wall-" + state.wall, "floor-" + state.floor);
  furnBox.innerHTML = "";
  state.placed.forEach((p) => {
    const it = findItem("furniture", p.id); if (!it) return;
    const el = document.createElement("div");
    el.className = "furn"; el.textContent = it.ico; el.title = it.name;
    el.style.left = p.x + "%"; el.style.top = p.y + "%";
    el.style.fontSize = it.size + "px"; el.style.zIndex = Math.round(p.y);
    el.addEventListener("pointerdown", (e) => startDrag(e, p, el));
    furnBox.appendChild(el);
  });
}

function startDrag(e, p, el) {
  if (!decoMode) return;
  e.preventDefault();
  const rr = room.getBoundingClientRect();
  const sx = e.clientX, sy = e.clientY; let moved = false;
  el.setPointerCapture(e.pointerId); el.classList.add("dragging");
  const move = (ev) => {
    if (Math.hypot(ev.clientX - sx, ev.clientY - sy) > 5) moved = true;
    p.x = Math.max(4, Math.min(96, ((ev.clientX - rr.left) / rr.width) * 100));
    p.y = Math.max(14, Math.min(99, ((ev.clientY - rr.top) / rr.height) * 100));
    el.style.left = p.x + "%"; el.style.top = p.y + "%"; el.style.zIndex = Math.round(p.y);
  };
  const up = () => {
    el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up);
    el.classList.remove("dragging");
    if (!moved) state.placed = state.placed.filter((q) => q !== p); // 누르기만 하면 치우기
    applyRoom(); renderDeco(); save();
  };
  el.addEventListener("pointermove", move); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
}

function setDeco(on) {
  decoMode = on;
  room.classList.toggle("deco", on);
  $("#deco-panel").hidden = !on;
  $("#actions").hidden = on;
  if (on) renderDeco();
}
$("#btn-deco").addEventListener("click", () => setDeco(!decoMode));
$("#btn-deco-done").addEventListener("click", () => { setDeco(false); save(); toast("방 꾸미기 완료!"); });
document.querySelectorAll(".deco-tabs [data-tab]").forEach((b) =>
  b.addEventListener("click", () => { decoTab = b.dataset.tab; renderDeco(); }));

function renderDeco() {
  document.querySelectorAll(".deco-tabs [data-tab]").forEach((b) => b.classList.toggle("on", b.dataset.tab === decoTab));
  const list = $("#deco-list"); list.innerHTML = "";
  const add = (html, on, fn) => {
    const b = document.createElement("button"); b.className = "deco-item" + (on ? " on" : "");
    b.innerHTML = html; b.addEventListener("click", fn); list.appendChild(b);
  };
  if (decoTab === "furniture") {
    if (!state.furn.length) list.innerHTML = `<p class="deco-empty">가구가 아직 없어요. 🛒 상점에서 사 오세요!</p>`;
    state.furn.forEach((id) => {
      const it = findItem("furniture", id);
      add(`<b>${it.ico}</b>${it.name}`, hasPlaced(id), () => {
        if (hasPlaced(id)) state.placed = state.placed.filter((p) => p.id !== id); else placeItem(id);
        applyRoom(); renderDeco(); save();
      });
    });
  } else {
    const owned = decoTab === "wall" ? state.walls : state.floors;
    SHOP[decoTab].filter((x) => owned.includes(x.id)).forEach((it) => {
      add(`${swatch(decoTab, it.id)}${it.name}`, state[decoTab] === it.id, () => {
        state[decoTab] = it.id; applyRoom(); renderDeco(); save();
      });
    });
    if (owned.length < SHOP[decoTab].length) add(`<b>🛒</b>더 사기`, false, () => { shopTab = decoTab; renderShop(); shopDlg.showModal(); });
  }
}

// ---------- 공받기 미니게임 ----------
const MG = { el: $("#minigame"), cv: $("#mg-canvas"), running: false };
const MG_ITEMS = [
  { ico: "🎾", pts: 1, w: 60 },
  { ico: "🦴", pts: 2, w: 15 },
  { ico: "⭐", pts: 3, w: 7 },
  { ico: "💧", pts: 0, bad: true, w: 18 },
];
const MG_TIME = 40;

$("#btn-game").addEventListener("click", () => {
  if (state.sleeping) return say("쿨쿨… 자는 중이에요");
  if (state.stats.energy < 20) return say(pick(lines().tooTired));
  MG.img = new Image(); MG.img.src = IMG(sprite());
  MG.el.hidden = false;
  showMgOverlay(`<h2>공받기</h2>
    <p>좌우로 끌거나 ← → 키로 움직여서<br>떨어지는 것을 받아요!</p>
    <p class="legend">🎾 +1 &nbsp; 🦴 +2 &nbsp; ⭐ +3 &nbsp; 💧 피하기</p>
    <p>받은 점수만큼 🪙 코인을 받아요 · 최고 기록 ${state.best}</p>`, "시작!");
  resizeMg(); drawMg();
});
function showMgOverlay(html, btn) {
  const o = $("#mg-overlay");
  o.innerHTML = html + `<button id="mg-start" class="primary big">${btn}</button><button id="mg-quit" class="link">그만하기</button>`;
  o.hidden = false;
  $("#mg-start").addEventListener("click", startMg);
  $("#mg-quit").addEventListener("click", quitMg);
}
function quitMg() { MG.running = false; MG.el.hidden = true; render(); }

function resizeMg() {
  const r = MG.cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  MG.w = r.width; MG.h = r.height;
  MG.cv.width = r.width * dpr; MG.cv.height = r.height * dpr;
  MG.ctx = MG.cv.getContext("2d"); MG.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  MG.pw = Math.min(110, MG.w * 0.26);
  MG.px ??= MG.w / 2;
}
window.addEventListener("resize", () => { if (!MG.el.hidden) resizeMg(); });

function startMg() {
  if (state.stats.energy < 20) { quitMg(); return say(pick(lines().tooTired)); }
  $("#mg-overlay").hidden = true;
  resizeMg();
  Object.assign(MG, { running: true, items: [], score: 0, lives: 3, t: MG_TIME, spawn: 0, px: MG.w / 2, target: MG.w / 2, flip: false, last: performance.now(), pops: [] });
  requestAnimationFrame(loopMg);
}
const setTarget = (clientX) => { const r = MG.cv.getBoundingClientRect(); MG.target = clientX - r.left; };
MG.cv.addEventListener("pointerdown", (e) => { setTarget(e.clientX); MG.cv.setPointerCapture(e.pointerId); });
MG.cv.addEventListener("pointermove", (e) => { if (e.buttons || e.pointerType === "mouse") setTarget(e.clientX); });
const keys = {};
window.addEventListener("keydown", (e) => { if (MG.running && (e.key === "ArrowLeft" || e.key === "ArrowRight")) { keys[e.key] = true; e.preventDefault(); } });
window.addEventListener("keyup", (e) => { keys[e.key] = false; });

function loopMg(now) {
  if (!MG.running) return;
  const dt = Math.min(0.05, (now - MG.last) / 1000); MG.last = now;
  MG.t -= dt;
  // 이동
  if (keys.ArrowLeft) MG.target = MG.px - 400 * dt;
  if (keys.ArrowRight) MG.target = MG.px + 400 * dt;
  MG.target = Math.max(MG.pw / 2, Math.min(MG.w - MG.pw / 2, MG.target));
  const dx = MG.target - MG.px;
  if (Math.abs(dx) > 1) MG.flip = dx > 0;
  MG.px += dx * Math.min(1, dt * 14);
  // 생성 (시간이 갈수록 빨라짐)
  const prog = 1 - MG.t / MG_TIME;
  MG.spawn -= dt;
  if (MG.spawn <= 0) {
    MG.spawn = 0.75 - prog * 0.4;
    let r = Math.random() * 100, kind = MG_ITEMS[0];
    for (const k of MG_ITEMS) { if ((r -= k.w) < 0) { kind = k; break; } }
    MG.items.push({ ...kind, x: 20 + Math.random() * (MG.w - 40), y: -30, v: 140 + prog * 180 + Math.random() * 60, rot: Math.random() * 6 });
  }
  // 이동·충돌
  const catchY = MG.h - MG.pw * 0.85;
  MG.items.forEach((it) => {
    it.y += it.v * dt; it.rot += dt * 3;
    if (!it.done && it.y > catchY && it.y < catchY + 40 && Math.abs(it.x - MG.px) < MG.pw * 0.5) {
      it.done = true;
      if (it.bad) { MG.lives--; MG.pops.push({ x: it.x, y: catchY, txt: "앗!", t: 0.8, bad: true }); }
      else { MG.score += it.pts; MG.pops.push({ x: it.x, y: catchY, txt: "+" + it.pts, t: 0.8 }); }
    }
  });
  MG.items = MG.items.filter((it) => !it.done && it.y < MG.h + 40);
  MG.pops.forEach((p) => { p.t -= dt; p.y -= 50 * dt; });
  MG.pops = MG.pops.filter((p) => p.t > 0);

  $("#mg-score").textContent = MG.score;
  $("#mg-time").textContent = Math.max(0, Math.ceil(MG.t));
  $("#mg-lives").textContent = "❤️".repeat(Math.max(0, MG.lives)) + "🤍".repeat(3 - Math.max(0, MG.lives));
  drawMg();
  if (MG.t <= 0 || MG.lives <= 0) return endMg();
  requestAnimationFrame(loopMg);
}

function drawMg() {
  const c = MG.ctx; if (!c) return;
  c.clearRect(0, 0, MG.w, MG.h);
  c.textAlign = "center"; c.textBaseline = "middle";
  (MG.items || []).forEach((it) => {
    c.save(); c.translate(it.x, it.y); if (!it.bad) c.rotate(it.rot);
    c.font = "34px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif"; c.fillText(it.ico, 0, 0); c.restore();
  });
  if (MG.img && MG.img.complete && MG.img.naturalWidth) {
    const w = MG.pw, h = w * MG.img.naturalHeight / MG.img.naturalWidth;
    c.fillStyle = "rgba(60,90,30,.18)"; c.beginPath(); c.ellipse(MG.px, MG.h - 8, w * 0.4, 8, 0, 0, Math.PI * 2); c.fill();
    c.save(); c.translate(MG.px, MG.h - 6 - h / 2); if (MG.flip) c.scale(-1, 1);
    c.drawImage(MG.img, -w / 2, -h / 2, w, h); c.restore();
  }
  (MG.pops || []).forEach((p) => {
    c.globalAlpha = Math.min(1, p.t * 2); c.font = "bold 22px sans-serif";
    c.fillStyle = p.bad ? "#3b82c4" : "#ff7a45"; c.fillText(p.txt, p.x, p.y); c.globalAlpha = 1;
  });
}

function endMg() {
  MG.running = false;
  const earned = MG.score;
  const record = earned > state.best;
  if (record) state.best = earned;
  state.coins += earned;
  state.stats.energy = clamp(state.stats.energy - 15);
  state.stats.hunger = clamp(state.stats.hunger - 8);
  state.stats.fun = clamp(state.stats.fun + 20);
  gainXp(Math.round(earned / 2) + 3);
  save(); render();
  showMgOverlay(`<h2>${MG.lives <= 0 ? "아쉬워요!" : "끝!"}</h2>
    <p style="font-size:20px"><b>${earned}점</b> ${record ? "🏆 최고 기록!" : `(최고 ${state.best}점)`}</p>
    <p class="legend">🪙 +${earned} 코인 &nbsp; 🎾 행복 +20 &nbsp; 💤 기운 -15</p>`, "한 번 더!");
}

// ---------- 메뉴 ----------
const menu = $("#menu");
$("#btn-menu").addEventListener("click", () => {
  const b = breedInfo();
  const m = ageMonths(), [t, a] = GROWTH[state.breed], stg = stageOf();
  const next = stg === "baby" ? ["청소년", t] : stg === "teen" ? [STAGE_KO_SP[state.species].adult, a] : null;
  const nextTxt = next ? ` 다음 단계(${next[0]})까지 약 ${Math.max(1, Math.ceil((next[1] - m) / MONTHS_PER_DAY * 24))}시간 남았어요.` : " 다 자랐어요!";
  $("#menu-info").textContent = `${state.name} · ${SPECIES_KO[state.species]} (${b.name}, ${GENDER_KO[state.gender] || "-"}) · ${ageText(m)} ${STAGE_KO_SP[state.species][stg]} · 입양일 ${new Date(state.born).toLocaleDateString("ko-KR")}.${nextTxt} (실제 하루가 ${MONTHS_PER_DAY}개월이에요)`;
  $("#rename-input").value = state.name;
  const r = $("#btn-reset"); r.textContent = "처음부터 다시 하기"; r.classList.remove("confirm");
  menu.showModal();
});
$("#btn-close").addEventListener("click", () => menu.close());
$("#btn-rename").addEventListener("click", () => {
  const n = $("#rename-input").value.trim();
  if (!n) return;
  state.name = n; save(); render(); menu.close(); toast(`이제 이름은 ${n}!`);
});
$("#btn-reset").addEventListener("click", (e) => {
  const r = e.currentTarget;
  if (!r.classList.contains("confirm")) {
    r.classList.add("confirm"); r.textContent = "정말요? 한 번 더 누르면 지워져요"; return;
  }
  wipe(); state = null; clearInterval(tickTimer); clearInterval(wanderTimer);
  setDeco(false);
  menu.close(); resetAdoptForm(); show("start");
});

document.addEventListener("visibilitychange", () => { if (state) { if (document.hidden) save(); else tick(); } });
window.addEventListener("pagehide", save);

// ---------- 시작 ----------
const saved = load();
if (saved && BREEDS[saved.species]?.some((b) => b.id === saved.breed)) { state = saved; startGame(false); }
else show("start");
})();
</script>
